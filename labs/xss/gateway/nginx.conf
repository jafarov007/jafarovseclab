events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Path-Based Routing Server
    server {
        listen 9080 default_server;
        server_name _;

        # Exact match redirects
        location = /scenario/1 { return 301 /scenario/1/; }
        location = /s1 { return 301 /s1/; }
        location = /scenario/2 { return 301 /scenario/2/; }
        location = /s2 { return 301 /s2/; }
        location = /scenario/3 { return 301 /scenario/3/; }
        location = /s3 { return 301 /s3/; }
        location = /scenario/4 { return 301 /scenario/4/; }
        location = /s4 { return 301 /s4/; }

        # Scenario 1 Proxy
        location /scenario/1/ {
            proxy_pass http://xss-s1:9081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
        }
        location /s1/ {
            proxy_pass http://xss-s1:9081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
        }

        # Scenario 2 Proxy
        location /scenario/2/ {
            proxy_pass http://xss-s2:9082/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
        }
        location /s2/ {
            proxy_pass http://xss-s2:9082/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
        }

        # Scenario 3 Proxy
        location /scenario/3/ {
            proxy_pass http://xss-s3:9083/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
        }
        location /s3/ {
            proxy_pass http://xss-s3:9083/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
        }

        # Scenario 4 Proxy
        location /scenario/4/ {
            proxy_pass http://xss-s4:9084/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
        }
        location /s4/ {
            proxy_pass http://xss-s4:9084/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
        }

        # Fallback to Scenario 1
        location / {
            proxy_pass http://xss-s1:9081/;
            proxy_set_header Host $host;
        }
    }

    # Direct Port Forwarding
    server {
        listen 9081;
        location / {
            proxy_pass http://xss-s1:9081;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 9082;
        location / {
            proxy_pass http://xss-s2:9082;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 9083;
        location / {
            proxy_pass http://xss-s3:9083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
        }
    }

    server {
        listen 9084;
        location / {
            proxy_pass http://xss-s4:9084;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_x_real_ip;
        }
    }
}
