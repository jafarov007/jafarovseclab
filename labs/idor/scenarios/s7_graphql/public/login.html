<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GraphQL DevConsole | Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0c0208; color: #f1f5f9; margin: 0; padding: 0; display: flex; height: 100vh; align-items: center; justify-content: center; }
    .login-card { width: 380px; background: #1a0514; border: 2px solid #ff0055; padding: 40px; border-radius: 12px; box-shadow: 0 0 30px rgba(255,0,85,0.3); }
    .logo { font-family: 'Fira Code', monospace; font-size: 1.3rem; font-weight: 700; color: #ff0055; text-align: center; margin-bottom: 30px; text-shadow: 0 0 8px rgba(255,0,85,0.5); }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: #ff7ebb; margin-bottom: 8px; text-transform: uppercase; }
    input { width: 100%; padding: 12px; background: #0c0208; border: 1px solid #ff0055; border-radius: 6px; color: #fff; font-family: inherit; font-size: 0.95rem; box-sizing: border-box; outline: none; }
    input:focus { border-color: #ff5599; box-shadow: 0 0 10px rgba(255,0,85,0.2); }
    .btn { width: 100%; background: #ff0055; color: #fff; font-weight: 700; border: none; padding: 14px; cursor: pointer; border-radius: 6px; font-size: 0.9rem; text-transform: uppercase; transition: all 0.2s; }
    .btn:hover { background: #e6004c; box-shadow: 0 0 15px rgba(255,0,85,0.4); }
    .error { color: #f87171; font-size: 0.85rem; margin-top: 15px; text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">&lt;GRAPHQL PLAYGROUND&gt;</div>
    <form onsubmit="doLogin(event)">
      <div class="form-group">
        <label>Developer Identity</label>
        <input type="email" id="email" required placeholder="user.b@example.com">
      </div>
      <div class="form-group">
        <label>Security Token</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button class="btn" type="submit">Initialize Session</button>
      <div id="err" class="error"></div>
    </form>
  </div>
  <script>
    async function doLogin(e) {
      e.preventDefault();
      const basePath = window.location.pathname.replace(/\/$/, '');
      const res = await fetch(basePath + '/api/v7/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      if (res.ok) {
        window.location.reload();
      } else {
        const d = await res.json();
        document.getElementById('err').textContent = d.error || 'Login failed';
      }
    }
  </script>
</body>
</html>
