<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GraphQL Studio | API Developer Playground</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg-dark: #0c0208; --bg-card: #1a0514; --accent: #ff0055; --border: #3b0a2c; --text: #f1f5f9; --text-muted: #ff7ebb; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-dark); color: var(--text); margin: 0; padding: 0; min-height: 100vh; }
    .nav { height: 70px; background: #14030f; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
    .logo { font-family: 'Fira Code', monospace; font-weight: 700; font-size: 1.15rem; color: var(--accent); }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .user-pill { background: rgba(255,0,85,0.08); border: 1px solid rgba(255,0,85,0.15); color: var(--accent); padding: 8px 18px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; }
    .logout-btn { color: #f87171; text-decoration: none; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; cursor: pointer; }
    .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 40px; box-shadow: 0 0 35px rgba(255,0,85,0.15); margin-bottom: 24px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .card-title { font-family: 'Fira Code', monospace; font-size: 1.3rem; font-weight: 700; color: #fff; margin: 0; }
    .btn { background: var(--accent); color: #fff; font-weight: 700; border: none; padding: 12px 28px; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; font-size: 0.88rem; text-transform: uppercase; }
    .btn:hover { background: #e6004c; box-shadow: 0 0 15px rgba(255,0,85,0.3); }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
    textarea { width: 100%; padding: 12px; background: #0c0208; border: 1px solid #ff0055; border-radius: 6px; color: #fff; font-family: 'JetBrains Mono'; box-sizing: border-box; outline: none; }
    textarea:focus { border-color: #ff5599; }
    pre { background: #070105; padding: 20px; border-radius: 6px; border: 1px solid var(--border); color: var(--accent); font-family: 'JetBrains Mono'; overflow-x: auto; font-size: 0.85rem; }
    .footer-link { text-align: right; margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px; }
    .footer-link a { color: #f472b6; font-family: 'JetBrains Mono'; text-decoration: none; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="nav">
    <div class="logo">🚀 GraphQL Apollo Studio</div>
    <div class="nav-right">
      <div class="user-pill">👤 Client: {{USER_NAME}}</div>
      <a href="#" onclick="logout()" class="logout-btn">Log Out</a>
    </div>
  </div>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">GraphQL Query & Mutation Explorer</h3>
      </div>
      <p style="color:var(--text-muted); font-size:0.9rem;">Test GraphQL mutations and introspection queries against the backend API endpoint.</p>
      
      <form method="POST" action="">
        <div class="form-group">
          <label>GraphQL Payload</label>
          <textarea name="query" rows="6">{{PAYLOAD_QUERY}}</textarea>
        </div>
        <button class="btn" type="submit">Execute Request</button>
      </form>

      <h4 style="margin-top:28px; font-size:0.95rem; text-transform:uppercase; color:#fff;">API Response Output</h4>
      <pre id="out">{{API_RESPONSE}}</pre>

      <div class="footer-link">
        <a href="code" target="_blank">🔍 GraphQL Schema & Source Code Review (/code)</a>
      </div>
    </div>
  </div>
  <script>
    function logout() {
      let path = window.location.pathname;
      if (!path.endsWith('/')) path += '/';
      window.location.href = path + 'logout';
    }
  </script>
</body>
</html>
