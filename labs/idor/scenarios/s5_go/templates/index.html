<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SecureAuth Enterprise | Password Recovery</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg-dark: #000000; --bg-card: #000000; --accent: #ff5500; --border: #ffffff; --text: #ffffff; --text-muted: #888888; }
    body { font-family: 'JetBrains Mono', monospace; background: var(--bg-dark); color: var(--text); margin: 0; padding: 0; min-height: 100vh; }
    .nav { height: 70px; background: #000; border-bottom: 4px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
    .logo { font-weight: 700; font-size: 1.2rem; color: var(--text); text-transform: uppercase; }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .user-pill { border: 2px solid var(--border); padding: 6px 14px; font-size: 0.85rem; font-weight: 700; }
    .logout-btn { color: #ff5500; text-decoration: none; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; cursor: pointer; }
    .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    .card { background: var(--bg-card); border: 4px solid var(--border); padding: 40px; box-shadow: 10px 10px 0px #ffffff; margin-bottom: 24px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 2px solid var(--border); padding-bottom: 16px; }
    .card-title { font-size: 1.3rem; font-weight: 700; text-transform: uppercase; margin: 0; }
    .btn { background: var(--text); color: #000; font-weight: 700; border: 2px solid var(--border); padding: 12px 28px; cursor: pointer; font-size: 0.88rem; text-transform: uppercase; }
    .btn:hover { background: #000; color: #fff; }
    .btn-sec { background: transparent; border: 2px solid var(--border); color: var(--text); padding: 10px 18px; cursor: pointer; font-size: 0.85rem; text-transform: uppercase; }
    .btn-sec:hover { background: #fff; color: #000; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; }
    input { width: 100%; padding: 12px; background: #000; border: 2px solid var(--border); color: #fff; font-family: 'JetBrains Mono'; box-sizing: border-box; outline: none; }
    .status-alert { border: 2px solid var(--accent); color: var(--accent); padding: 14px; margin-bottom: 20px; font-weight: 700; text-transform: uppercase; }
    .footer-link { text-align: right; margin-top: 24px; border-top: 2px solid var(--border); padding-top: 16px; }
    .footer-link a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; border-bottom: 1px dotted var(--text-muted); }
  </style>
</head>
<body>
  <div class="nav">
    <div class="logo">SECUREAUTH SSO SYSTEM</div>
    <div class="nav-right">
      <div class="user-pill">USER: {{.CurrentName}}</div>
      <a href="#" onclick="logout()" class="logout-btn">LOG OUT</a>
    </div>
  </div>
  <div class="container">
    {{if .StatusText}}<div class="status-alert">{{.StatusText}}</div>{{end}}
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Reset Account Password</h3>
        <button class="btn-sec" onclick="checkInbox()">📬 OPEN INBOX</button>
      </div>
      
      <form id="reset-form" method="POST" action="">
        <script>
          document.getElementById('reset-form').action = window.location.pathname.replace(/\/$/, '') + '/api/v5/confirm-reset';
        </script>
        <input type="hidden" name="user_id" value="{{.UserID}}">
        <div class="form-group">
          <label>Password Reset Token (From Inbox)</label>
          <input type="text" name="reset_token" placeholder="Paste reset token from inbox">
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" name="new_password" placeholder="Enter new password">
        </div>
        <button type="submit" class="btn">Update Password</button>
      </form>

      <div class="footer-link">
        <a href="code" target="_blank">🔍 Go Source Code Review (/code)</a>
      </div>
    </div>
  </div>
  <script>
    async function checkInbox() {
      const basePath = window.location.pathname.replace(/\/$/, '');
      const res = await fetch(basePath + '/api/v5/inbox');
      const data = await res.json();
      if (data.inbox && data.inbox.length > 0) {
        const item = data.inbox[0];
        alert('INBOX NOTICE:\nFrom: ' + item.from + '\nSubject: ' + item.subject + '\nReset Token: ' + item.reset_token + '\nFor User ID: ' + item.user_id);
      }
    }
    function logout() {
      let path = window.location.pathname;
      if (!path.endsWith('/')) path += '/';
      window.location.href = path + 'logout';
    }
  </script>
</body>
</html>
