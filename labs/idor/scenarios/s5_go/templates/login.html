<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SecureAuth Recovery | Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'JetBrains Mono', monospace; background: #000; color: #fff; margin: 0; padding: 0; display: flex; height: 100vh; align-items: center; justify-content: center; }
    .login-card { width: 360px; border: 4px solid #fff; padding: 40px; background: #000; box-shadow: 10px 10px 0px #fff; }
    h2 { font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 30px; text-transform: uppercase; border-bottom: 2px solid #fff; padding-bottom: 10px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
    input { width: 100%; padding: 12px; background: #000; border: 2px solid #fff; color: #fff; font-family: inherit; font-size: 0.95rem; box-sizing: border-box; outline: none; }
    input:focus { background: #111; }
    .btn { width: 100%; background: #fff; color: #000; font-weight: 700; border: none; padding: 14px; cursor: pointer; font-size: 0.9rem; text-transform: uppercase; border: 2px solid #fff; transition: all 0.2s; }
    .btn:hover { background: #000; color: #fff; }
    .error { color: #ff5500; font-size: 0.85rem; margin-top: 15px; text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>SECUREAUTH RECOVERY</h2>
    <form method="POST" action="">
      <div class="form-group">
        <label>Operator Email</label>
        <input type="email" name="email" required placeholder="user.b@example.com">
      </div>
      <div class="form-group">
        <label>Credentials</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button class="btn" type="submit">Unlock System</button>
      {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    </form>
  </div>
</body>
</html>
