<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CorpEnterprise | Internal Login Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; background: #fdfbf7; color: #2c2a29; margin: 0; padding: 0; display: flex; height: 100vh; align-items: center; justify-content: center; }
    .login-card { width: 400px; background: #ffffff; border: 1px solid #e6dfd5; padding: 48px; border-radius: 4px; box-shadow: 0 12px 30px rgba(44,42,41,0.05); }
    h2 { font-family: 'Cinzel', serif; font-size: 1.5rem; text-align: center; margin-bottom: 32px; letter-spacing: 1px; color: #1a1918; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; color: #6e6a66; }
    input { width: 100%; padding: 12px; border: 1px solid #dcd5cc; border-radius: 2px; font-family: inherit; font-size: 0.9rem; box-sizing: border-box; background: #faf8f5; color: #2c2a29; outline: none; }
    input:focus { border-color: #8c7f70; background: #ffffff; }
    .btn { width: 100%; background: #1a1918; color: #ffffff; font-weight: 700; border: none; padding: 14px; cursor: pointer; border-radius: 2px; text-transform: uppercase; letter-spacing: 1px; font-size: 0.85rem; margin-top: 10px; transition: all 0.2s; }
    .btn:hover { background: #3b3936; }
    .error { color: #b05a4e; font-size: 0.82rem; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>CorpEnterprise</h2>
    <form onsubmit="doLogin(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="user.b@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button class="btn" type="submit">Sign In</button>
      <div id="err" class="error"></div>
    </form>
  </div>
  <script>
    async function doLogin(e) {
      e.preventDefault();
      const basePath = window.location.pathname.replace(/\/$/, '');
      const res = await fetch(basePath + '/api/v1/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      if (res.ok) {
        window.location.reload();
      } else {
        const d = await res.json();
        document.getElementById('err').textContent = d.error || 'Login failed';
      }
    }
  </script>
</body>
</html>
