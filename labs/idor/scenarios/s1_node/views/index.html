<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CorpEnterprise Portal | Employee Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg-light: #fdfbf7; --bg-card: #ffffff; --accent: #8c7f70; --border: #e6dfd5; --text: #2c2a29; --text-muted: #7d7771; }
    body { font-family: 'Montserrat', sans-serif; background: var(--bg-light); color: var(--text); margin: 0; padding: 0; min-height: 100vh; }
    .nav { height: 70px; background: #ffffff; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
    .logo { font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.2rem; color: #1a1918; display: flex; align-items: center; gap: 10px; }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .user-pill { background: #faf8f5; border: 1px solid var(--border); color: #2c2a29; padding: 8px 18px; border-radius: 4px; font-size: 0.85rem; font-weight: 600; }
    .logout-btn { color: #b05a4e; text-decoration: none; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .container { max-width: 900px; margin: 50px auto; padding: 0 20px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 4px; padding: 40px; box-shadow: 0 10px 30px rgba(44,42,41,0.03); margin-bottom: 24px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
    .card-title { font-family: 'Cinzel', serif; font-size: 1.4rem; color: #1a1918; margin: 0; }
    .btn { background: #1a1918; color: #fff; font-weight: 700; border: none; padding: 12px 28px; border-radius: 2px; cursor: pointer; transition: all 0.2s ease; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
    .btn:hover { background: #3b3936; }
    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; }
    .info-box { background: #faf8f5; border: 1px solid #e6dfd5; padding: 18px; border-radius: 2px; }
    .info-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; font-family: 'JetBrains Mono'; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.5px; }
    .info-val { font-size: 1.05rem; font-weight: 600; color: #1a1918; }
    .footer-link { text-align: right; margin-top: 24px; border-top: 1px solid var(--border); padding-top: 16px; }
    .footer-link a { color: var(--accent); font-family: 'JetBrains Mono'; text-decoration: none; font-size: 0.85rem; font-weight: 600; }
  </style>
</head>
<body>
  <div class="nav">
    <div class="logo">CorpEnterprise Portal</div>
    <div class="nav-right">
      <div class="user-pill">👤 Active User: {{USER_NAME}}</div>
      <a href="/logout" class="logout-btn">Logout</a>
    </div>
  </div>
  <div class="container">
    <div class="card">
      <div class="card-header">
        <h3 class="card-title">Employee Records Profile</h3>
        <button class="btn" onclick="loadMyProfile()">Sync & Load Profile</button>
      </div>
      <p style="color:var(--text-muted); font-size:0.9rem;">Submit synchronisation parameters to verify token and load corresponding database files.</p>
      
      <div class="profile-grid" id="profile-display">
        <div class="info-box"><div class="info-label">Full Name</div><div class="info-val" id="val-name">-</div></div>
        <div class="info-box"><div class="info-label">Email Address</div><div class="info-val" id="val-email">-</div></div>
        <div class="info-box"><div class="info-label">Contact Phone</div><div class="info-val" id="val-phone">-</div></div>
        <div class="info-box"><div class="info-label">Bio / Role</div><div class="info-val" id="val-bio">-</div></div>
      </div>
      <div class="footer-link">
        <a href="code" target="_blank">🔍 White-Box Source Code Review (/code)</a>
      </div>
    </div>
  </div>
  <script>
    async function loadMyProfile() {
      const userId = {{USER_ID}};
      const authToken = "{{USER_TOKEN}}";
      const timestamp = {{TIMESTAMP}};
      const basePath = window.location.pathname.replace(/\/$/, '');
      
      const res = await fetch(`${basePath}/api/v1/user/profile?user_id=${userId}&auth_token=${authToken}&timestamp=${timestamp}`);
      const json = await res.json();
      if (json.success) {
        document.getElementById('val-name').textContent = json.data.full_name;
        document.getElementById('val-email').textContent = json.data.email;
        document.getElementById('val-phone').textContent = json.data.phone;
        document.getElementById('val-bio').textContent = json.data.bio || json.data.address;
      }
    }
  </script>
</body>
</html>
