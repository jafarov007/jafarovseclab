<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpringAdmin Suite | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0f172a; color: #f1f5f9; margin: 0; padding: 0; display: flex; height: 100vh; align-items: center; justify-content: center; }
    .login-card { width: 380px; background: #1e293b; border: 1px solid #334155; padding: 40px; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    .logo { font-size: 1.4rem; font-weight: 800; color: #38bdf8; text-align: center; margin-bottom: 30px; letter-spacing: -0.5px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; }
    input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-family: inherit; font-size: 0.95rem; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #38bdf8; }
    .btn { width: 100%; background: #38bdf8; color: #0f172a; font-weight: 700; border: none; padding: 14px; cursor: pointer; border-radius: 6px; font-size: 0.9rem; text-transform: uppercase; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">☕ SPRINGADMIN PORTAL</div>
    <form method="POST" action="">
      <div class="form-group">
        <label>Operator Email</label>
        <input type="email" name="email" required placeholder="user.b@example.com">
      </div>
      <div class="form-group">
        <label>Security Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button class="btn" type="submit">Access Control Room</button>
    </form>
  </div>
</body>
</html>
