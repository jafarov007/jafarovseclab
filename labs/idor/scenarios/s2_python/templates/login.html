<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FinTech Wealth Portal - Log In</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #040806; color: #e2e8f0; margin: 0; padding: 0; display: flex; height: 100vh; align-items: center; justify-content: center; }
    .login-card { width: 380px; background: #0b1410; border: 1px solid #14291e; padding: 40px; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
    .logo { font-family: 'Cinzel', serif; font-size: 1.6rem; color: #10b981; text-align: center; margin-bottom: 30px; letter-spacing: 2px; }
    .form-group { margin-bottom: 22px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: #6ee7b7; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    input { width: 100%; padding: 12px 16px; background: #070d0a; border: 1px solid #142c1f; border-radius: 6px; color: #fff; font-family: inherit; font-size: 0.95rem; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #10b981; }
    .btn { width: 100%; background: #10b981; color: #022c22; font-weight: 700; border: none; padding: 14px; cursor: pointer; border-radius: 6px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .error { color: #f87171; font-size: 0.85rem; margin-top: 15px; text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">FINTECH WEALTH</div>
    <form method="POST" action="">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" required placeholder="user.b@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button class="btn" type="submit">Access Portfolio</button>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </form>
  </div>
</body>
</html>
