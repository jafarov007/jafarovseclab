<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CloudMedia Studio | Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b0f19; color: #f1f5f9; margin: 0; padding: 0; display: flex; height: 100vh; align-items: center; justify-content: center; }
    .login-card { width: 380px; background: #111827; border: 1px solid #1f2937; padding: 40px; border-radius: 16px; box-shadow: 0 20px 45px rgba(0,0,0,0.4); }
    .logo { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; font-weight: 700; color: #0d9488; text-align: center; margin-bottom: 30px; letter-spacing: -0.5px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: #38bdf8; margin-bottom: 8px; }
    input { width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #1f2937; border-radius: 8px; color: #fff; font-family: inherit; font-size: 0.95rem; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #0d9488; }
    .btn { width: 100%; background: #0d9488; color: #fff; font-weight: 700; border: none; padding: 14px; cursor: pointer; border-radius: 8px; font-size: 0.9rem; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .error { color: #f87171; font-size: 0.85rem; margin-top: 15px; text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">CLOUDMEDIA STUDIO</div>
    <form onsubmit="doLogin(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="user.b@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button class="btn" type="submit">Open Workspace</button>
      <div id="err" class="error"></div>
    </form>
  </div>
  <script>
    async function doLogin(e) {
      e.preventDefault();
      const basePath = window.location.pathname.replace(/\/$/, '');
      const res = await fetch(basePath + '/api/v4/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
      });
      if (res.ok) {
        window.location.reload();
      } else {
        const d = await res.json();
        document.getElementById('err').textContent = d.error || 'Login failed';
      }
    }
  </script>
</body>
</html>
