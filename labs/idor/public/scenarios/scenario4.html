<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CloudMedia | Avatar & Gallery Manager (Scenario 4)</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #080f0c; color: #e2e8f0; margin: 0; padding: 40px; }
    .card { max-width: 650px; margin: 0 auto; background: #101e18; border: 1px solid #1a382b; border-radius: 12px; padding: 30px; }
    h2 { color: #00ffaa; margin-top: 0; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    input { width: 100%; padding: 10px; background: #080f0c; border: 1px solid #234d3b; border-radius: 6px; color: #fff; font-family: 'JetBrains Mono', monospace; }
    button { background: #00ffaa; color: #000; font-weight: 700; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #00cc88; }
    pre { background: #040806; padding: 16px; border-radius: 6px; color: #00ffaa; overflow-x: auto; font-family: 'JetBrains Mono', monospace; }
    .badge { background: rgba(0, 255, 170, 0.15); color: #00ffaa; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a382b; padding-bottom: 16px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header-bar">
      <h2>CloudMedia Manager</h2>
      <span class="badge">Node.js Express / v4</span>
    </div>
    <p style="color:#94a3b8; font-size:0.9rem;">Scenario 4: Profile Avatar & File Reference IDOR</p>

    <div class="form-group">
      <label>Target user_id</label>
      <input type="text" id="user_id" placeholder="e.g. 995043202">
    </div>
    <div class="form-group">
      <label>avatar_path File Reference</label>
      <input type="text" id="avatar_path" value="/uploads/avatars/user_995043202.png">
    </div>
    <button onclick="updateAvatar()">Update Profile Avatar</button>

    <h3 style="margin-top:24px; font-size:0.95rem;">API Response Output</h3>
    <pre id="output">// Results will appear here</pre>

    <div style="margin-top:20px; text-align:right;">
      <a href="/scenario/4/code" target="_blank" style="color:#a855f7; text-decoration:none; font-size:0.85rem; font-family:'JetBrains Mono';">🔍 Inspect Source Code (/code)</a>
    </div>
  </div>

  <script>
    async function updateAvatar() {
      const uid = document.getElementById('user_id').value;
      const path = document.getElementById('avatar_path').value;
      try {
        const res = await fetch('/api/v4/user/avatar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: parseInt(uid), avatar_path: path })
        });
        const data = await res.json();
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
      } catch(e) {
        document.getElementById('output').textContent = e.message;
      }
    }
  </script>
</body>
</html>
