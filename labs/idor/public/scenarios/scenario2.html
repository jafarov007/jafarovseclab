<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FinTech Analytics | Account Inspector (Scenario 2)</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #07090e; color: #e2e8f0; margin: 0; padding: 40px; }
    .card { max-width: 650px; margin: 0 auto; background: #0f1420; border: 1px solid #1e293b; border-radius: 12px; padding: 30px; }
    h2 { color: #00e5ff; margin-top: 0; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    input { width: 100%; padding: 10px; background: #07090e; border: 1px solid #334155; border-radius: 6px; color: #fff; font-family: 'JetBrains Mono', monospace; }
    button { background: #00e5ff; color: #000; font-weight: 700; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    button:hover { background: #00b8cc; }
    pre { background: #04060a; padding: 16px; border-radius: 6px; color: #00e5ff; overflow-x: auto; font-family: 'JetBrains Mono', monospace; }
    .badge { background: rgba(0, 229, 255, 0.15); color: #00e5ff; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 16px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header-bar">
      <h2>FinTech Analytics</h2>
      <span class="badge">Python Flask / v2</span>
    </div>
    <p style="color:#94a3b8; font-size:0.9rem;">Scenario 2: E-Notation Floating-Point IDOR Inspection</p>

    <div class="form-group">
      <label>user_id (Supports String & E-Notation e.g. 123e1)</label>
      <input type="text" id="user_id" placeholder="e.g. 123e1">
    </div>
    <div class="form-group">
      <label>session_user_id</label>
      <input type="text" id="session_user_id" placeholder="e.g. 123">
    </div>
    <button onclick="inspectAccount()">Inspect Account Data</button>

    <h3 style="margin-top:24px; font-size:0.95rem;">API Response Output</h3>
    <pre id="output">// Results will appear here</pre>

    <div style="margin-top:20px; text-align:right;">
      <a href="/scenario/2/code" target="_blank" style="color:#a855f7; text-decoration:none; font-size:0.85rem; font-family:'JetBrains Mono';">🔍 Inspect Python Source Code (/code)</a>
    </div>
  </div>

  <script>
    async function inspectAccount() {
      const uid = document.getElementById('user_id').value;
      const suid = document.getElementById('session_user_id').value;
      try {
        const res = await fetch(`/api/v2/user/profile?user_id=${encodeURIComponent(uid)}&session_user_id=${encodeURIComponent(suid)}`);
        const data = await res.json();
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
      } catch(e) {
        document.getElementById('output').textContent = e.message;
      }
    }
  </script>
</body>
</html>
