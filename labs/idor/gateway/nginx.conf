events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Path-Based Routing Server
    server {
        listen 80 default_server;
        listen 8080 default_server;
        server_name _;

        # Exact match redirects (no trailing slash -> add it)
        location = /scenario/1 { return 301 /scenario/1/; }
        location = /scenario/2 { return 301 /scenario/2/; }
        location = /scenario/3 { return 301 /scenario/3/; }
        location = /scenario/4 { return 301 /scenario/4/; }
        location = /scenario/5 { return 301 /scenario/5/; }
        location = /scenario/6 { return 301 /scenario/6/; }
        location = /scenario/7 { return 301 /scenario/7/; }
        location = /scenario/8 { return 301 /scenario/8/; }

        location = /s1 { return 301 /s1/; }
        location = /s2 { return 301 /s2/; }
        location = /s3 { return 301 /s3/; }
        location = /s4 { return 301 /s4/; }
        location = /s5 { return 301 /s5/; }
        location = /s6 { return 301 /s6/; }
        location = /s7 { return 301 /s7/; }
        location = /s8 { return 301 /s8/; }

        # Prefix location blocks with static proxy_pass (trailing slash = strip prefix)
        location /scenario/1/ {
            proxy_pass http://idor-s1:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /scenario/2/ {
            proxy_pass http://idor-s2:8082/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /scenario/3/ {
            proxy_pass http://idor-s3:8083/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /scenario/4/ {
            proxy_pass http://idor-s4:8084/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /scenario/5/ {
            proxy_pass http://idor-s5:8085/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /scenario/6/ {
            proxy_pass http://idor-s6:8086/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /scenario/7/ {
            proxy_pass http://idor-s7:8087/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /scenario/8/ {
            proxy_pass http://idor-s8:8088/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /s1/ {
            proxy_pass http://idor-s1:8081/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /s2/ {
            proxy_pass http://idor-s2:8082/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /s3/ {
            proxy_pass http://idor-s3:8083/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /s4/ {
            proxy_pass http://idor-s4:8084/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /s5/ {
            proxy_pass http://idor-s5:8085/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /s6/ {
            proxy_pass http://idor-s6:8086/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /s7/ {
            proxy_pass http://idor-s7:8087/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /s8/ {
            proxy_pass http://idor-s8:8088/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Fallback
        location / {
            proxy_pass http://idor-s1:8081/;
            proxy_set_header Host $host;
        }
    }

    # Direct Port Forwarding (8081-8088)
    server { listen 8081; location / { proxy_pass http://idor-s1:8081; proxy_set_header Host $host; } }
    server { listen 8082; location / { proxy_pass http://idor-s2:8082; proxy_set_header Host $host; } }
    server { listen 8083; location / { proxy_pass http://idor-s3:8083; proxy_set_header Host $host; } }
    server { listen 8084; location / { proxy_pass http://idor-s4:8084; proxy_set_header Host $host; } }
    server { listen 8085; location / { proxy_pass http://idor-s5:8085; proxy_set_header Host $host; } }
    server { listen 8086; location / { proxy_pass http://idor-s6:8086; proxy_set_header Host $host; } }
    server { listen 8087; location / { proxy_pass http://idor-s7:8087; proxy_set_header Host $host; } }
    server { listen 8088; location / { proxy_pass http://idor-s8:8088; proxy_set_header Host $host; } }
}
