version: '3.8'

services:
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "8777:8777"
    environment:
      - NODE_ENV=production
      - IDOR_LAB_URL=http://idor-gateway:8081
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - labnet
    restart: unless-stopped

  idor-gateway:
    build:
      context: ./labs/idor/gateway
      dockerfile: Dockerfile
    profiles:
      - scenarios
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      - "8083:8083"
      - "8084:8084"
      - "8085:8085"
      - "8086:8086"
      - "8087:8087"
      - "8088:8088"
    depends_on:
      - idor-s1
      - idor-s2
      - idor-s3
      - idor-s4
      - idor-s5
      - idor-s6
      - idor-s7
      - idor-s8
    networks:
      - labnet


  idor-s1:
    build:
      context: ./labs/idor/scenarios/s1_node
      dockerfile: Dockerfile
    profiles:
      - scenarios
    networks:
      - labnet


  idor-s2:
    build:
      context: ./labs/idor/scenarios/s2_python
      dockerfile: Dockerfile
    profiles:
      - scenarios
    networks:
      - labnet


  idor-s3:
    build:
      context: ./labs/idor/scenarios/s3_php
      dockerfile: Dockerfile
    profiles:
      - scenarios
    networks:
      - labnet


  idor-s4:
    build:
      context: ./labs/idor/scenarios/s4_node
      dockerfile: Dockerfile
    profiles:
      - scenarios
    networks:
      - labnet


  idor-s5:
    build:
      context: ./labs/idor/scenarios/s5_go
      dockerfile: Dockerfile
    profiles:
      - scenarios
    networks:
      - labnet


  idor-s6:
    build:
      context: ./labs/idor/scenarios/s6_java
      dockerfile: Dockerfile
    profiles:
      - scenarios
    networks:
      - labnet


  idor-s7:
    build:
      context: ./labs/idor/scenarios/s7_graphql
      dockerfile: Dockerfile
    profiles:
      - scenarios
    networks:
      - labnet


  idor-s8:
    build:
      context: ./labs/idor/scenarios/s8_python
      dockerfile: Dockerfile
    profiles:
      - scenarios
    networks:
      - labnet


  xss-gateway:
    build:
      context: ./labs/xss/gateway
      dockerfile: Dockerfile
    profiles:
      - scenarios
    ports:
      - "9080:9080"
      - "9081:9081"
      - "9082:9082"
      - "9083:9083"
      - "9084:9084"
    depends_on:
      - xss-s1
      - xss-s2
      - xss-s3
      - xss-s4
    networks:
      - labnet


  xss-s1:
    build:
      context: ./labs/xss/scenarios/s1_vue
      dockerfile: Dockerfile
    profiles:
      - scenarios
    networks:
      - labnet


  xss-s2:
    build:
      context: ./labs/xss/scenarios/s2_jquery
      dockerfile: Dockerfile
    profiles:
      - scenarios
    networks:
      - labnet


  xss-s3:
    build:
      context: ./labs/xss/scenarios/s3_php
      dockerfile: Dockerfile
    profiles:
      - scenarios
    networks:
      - labnet


  xss-s4:
    build:
      context: ./labs/xss/scenarios/s4_python
      dockerfile: Dockerfile
    profiles:
      - scenarios
    networks:
      - labnet


networks:
  labnet:
    driver: bridge
